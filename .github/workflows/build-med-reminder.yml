name: Build Hamrah Daroo APK
on:
  push:
    branches:
      - build-med-reminder-20261119
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android Platform 35
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build signed debug APK
        working-directory: med-reminder
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hamrah-Daroo-Android-APK
          path: med-reminder/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
