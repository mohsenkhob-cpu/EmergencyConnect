name: Validate RahYab APK

on:
  workflow_dispatch:
    inputs:
      verify_on_device:
        description: Run on the dedicated ARM64 Android test device
        type: boolean
        default: false
  push:
    branches:
      - rahyab-validation

permissions:
  contents: read
  actions: read

concurrency:
  group: rahyab-validation-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate Android SDK tools
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under $SDK_ROOT"
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
      - name: Install Android SDK packages
        run: |
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools"
          "$SDKMANAGER" "platforms;android-35"
          "$SDKMANAGER" "build-tools;35.0.0"
          "$SDKMANAGER" "ndk;27.2.12479018"
      - name: Wait for matching native build from this commit
        id: native-wait
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Checking native source changes for commit $GITHUB_SHA"
          CHANGED_FILES="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq '[.files[].filename] | .[]')"
          if printf '%s\n' "$CHANGED_FILES" | grep -Eq '^(overlay/native/|.github/workflows/openvpn-native-ci.yml$)'; then
            REQUIRE_EXACT_SHA=true
          else
            REQUIRE_EXACT_SHA=false
          fi
          echo "Require exact native commit: $REQUIRE_EXACT_SHA"
          for attempt in $(seq 1 120); do
            RUN_JSON="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/openvpn-native-ci.yml/runs?branch=rahyab-next&per_page=30")"
            if [ "$REQUIRE_EXACT_SHA" = true ]; then
              MATCH="$(printf '%s' "$RUN_JSON" | jq -r --arg sha "$GITHUB_SHA" '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.created_at) | last // empty')"
            else
              MATCH="$(printf '%s' "$RUN_JSON" | jq -r '[.workflow_runs[]] | sort_by(.created_at) | last // empty')"
            fi
            if [ -n "$MATCH" ]; then
              STATUS="$(printf '%s' "$MATCH" | jq -r '.status')"
              CONCLUSION="$(printf '%s' "$MATCH" | jq -r '.conclusion // empty')"
              RUN_ID="$(printf '%s' "$MATCH" | jq -r '.id')"
              echo "Native run $RUN_ID: status=$STATUS conclusion=$CONCLUSION"
              if [ "$STATUS" = "completed" ]; then
                if [ "$CONCLUSION" = "success" ]; then
                  echo "native_run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
                  exit 0
                fi
                echo "Matching native build did not succeed: $CONCLUSION"
                exit 1
              fi
            else
              echo "Matching native workflow run is not visible yet."
            fi
            sleep 30
          done
          echo "Timed out waiting for the matching native build."
          exit 1
      - name: Locate latest successful OpenVPN 3 native artifact
        id: native-artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID="${{ steps.native-wait.outputs.native_run_id }}"
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "No successful OpenVPN 3 native build was confirmed."
            exit 1
          fi
          ARTIFACT_COUNT="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" --jq '[.artifacts[] | select(.name == "RahYab-OpenVPN3-native-arm64-compile-check" and .expired == false)] | length')"
          if [ "$ARTIFACT_COUNT" -lt 1 ]; then
            echo "The latest successful native workflow has no usable ARM64 artifact."
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Using successful native build run $RUN_ID"

      - name: Download verified OpenVPN 3 ARM64 native library
        uses: actions/download-artifact@v4
        with:
          name: RahYab-OpenVPN3-native-arm64-compile-check
          repository: mohsenkhob-cpu/EmergencyConnect
          run-id: ${{ steps.native-artifact.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: app/src/main/jniLibs/arm64-v8a
      - name: Verify packaged OpenVPN 3 JNI ABI
        run: |
          LIB="app/src/main/jniLibs/arm64-v8a/libopenvpn3_jni.so"
          test -s "$LIB"
          file "$LIB" | grep -q "ARM aarch64"
          readelf -Ws "$LIB" | grep -q "Java_ir_emergencyconnect_engine_OpenVpn3Bridge_nativeStartSession"
          readelf -Ws "$LIB" | grep -q "Java_ir_emergencyconnect_engine_OpenVpn3Bridge_nativeBindTunService"
      - name: Strip native debug sections to reduce APK size
        run: |
          NDK_ROOT="$ANDROID_HOME/ndk/27.2.12479018"
          STRIP="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          test -x "$STRIP"
          find app/src/main/jniLibs -type f -name '*.so' -print0 | while IFS= read -r -d '' LIB; do
            BEFORE="$(stat -c%s "$LIB")"
            "$STRIP" --strip-debug "$LIB"
            AFTER="$(stat -c%s "$LIB")"
            echo "$(basename "$LIB"): $BEFORE -> $AFTER bytes"
          done
          readelf -Ws app/src/main/jniLibs/arm64-v8a/libopenvpn3_jni.so | grep -q "Java_ir_emergencyconnect_engine_OpenVpn3Bridge_nativeStartSession"
          readelf -Ws app/src/main/jniLibs/arm64-v8a/libopenvpn3_jni.so | grep -q "Java_ir_emergencyconnect_engine_OpenVpn3Bridge_nativeBindTunService"
      - name: Prepare Gradle's actual Android signing directory
        run: mkdir -p "$HOME/.config/.android"
      - name: Reuse Gradle debug signing key across CI builds
        uses: actions/cache@v4
        with:
          path: ~/.config/.android/debug.keystore
          key: rahyab-gradle-debug-keystore-v3
      - name: Ensure Gradle's effective debug signing key exists
        run: |
          KEYSTORE="$HOME/.config/.android/debug.keystore"
          if [ ! -s "$KEYSTORE" ]; then
            keytool -genkeypair -v \
              -keystore "$KEYSTORE" \
              -storepass android \
              -alias AndroidDebugKey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          test -s "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass android -alias AndroidDebugKey
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify experimental OpenVPN JNI and TUN safety contracts
        run: bash overlay/native/android-jni/check_session_gate.sh
      - name: Report effective Android signing configuration
        run: |
          set -euo pipefail
          gradle --no-daemon :app:signingReport | tee signing-report.txt
          echo "Signing report saved for diagnosis."
      - name: Build debug APK
        run: gradle --no-daemon -PciVersionCode="$GITHUB_RUN_NUMBER" testDebugUnitTest assembleDebug
      - name: Verify APK signature, package, ABI, alignment and checksum
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          test -s "$APK"
          unzip -tq "$APK"
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK"
          KEYSTORE="$HOME/.config/.android/debug.keystore"
          test -s "$KEYSTORE"
          EXPECTED_SIGNER="$(keytool -list -v -keystore "$KEYSTORE" -storepass android -alias AndroidDebugKey | awk -F': ' '/SHA256:/ {gsub(/:/, "", $2); print tolower($2); exit}')"
          ACTUAL_SIGNER="$( "$TOOLS/apksigner" verify --print-certs "$APK" | awk -F": " '/Signer #1 certificate SHA-256 digest:/ {print tolower($2)}' )"
          test -n "$EXPECTED_SIGNER"
          echo "Persistent keystore signer: $EXPECTED_SIGNER"
          echo "APK signer:                 $ACTUAL_SIGNER"
          if [ "$ACTUAL_SIGNER" != "$EXPECTED_SIGNER" ]; then
            echo "ERROR: APK signer does not match the persistent Gradle debug keystore. Refusing to publish."
            exit 1
          fi
          "$TOOLS/zipalign" -c -v 4 "$APK"
          "$TOOLS/aapt" dump badging "$APK" | grep -F "package: name='com.rahyab.next'"
          "$TOOLS/aapt" dump badging "$APK" | grep -F "native-code: 'arm64-v8a'"
          {
            echo "APK bytes: $(stat -c%s "$APK")"
            sha256sum "$APK"
            "$TOOLS/apksigner" verify --print-certs "$APK" | grep -E "Signer #1 certificate SHA-256 digest:"
          } | tee "app/build/outputs/apk/debug/APK-INTEGRITY.txt"
      - name: Upload verified APK and integrity report
        uses: actions/upload-artifact@v4
        with:
          name: RahYab-Next-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/APK-INTEGRITY.txt
          if-no-files-found: error

  verify-on-device:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/rahyab-validation' && inputs.verify_on_device
    needs: build
    runs-on: [self-hosted, rahyab-android-device]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: RahYab-Next-debug
          path: device-test
      - name: Verify one-tap connection and HTTPS egress
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check-smart-connect.py device-test/app-debug.apk | tee device-test-result.txt
      - name: Upload device test result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RahYab-device-test-result
          path: device-test-result.txt
          if-no-files-found: ignore

  verify-on-emulator:
    if: github.ref == 'refs/heads/rahyab-validation'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Wait for the x86_64 OpenVPN library
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/42316847954" --jq '.conclusion // "pending"')"
            case "$status" in
              success) exit 0 ;;
              pending) sleep 15 ;;
              *) echo "x86_64 OpenVPN build ended with $status"; exit 1 ;;
            esac
          done
          echo "Timed out waiting for x86_64 OpenVPN"
          exit 1
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 42316847954
          name: RahYab-OpenVPN3-native-x86_64-compile-check
          path: app/src/main/jniLibs/x86_64
      - name: Build the x86_64 test APK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          test -s app/src/main/jniLibs/x86_64/libopenvpn3_jni.so
          gradle --no-daemon -PemulatorAbi -PciVersionCode="$GITHUB_RUN_NUMBER" assembleDebug
          "$SDK/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -Fx "native-code: 'x86_64'"
      - name: Boot Android emulator and run Smart Connect
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          IMAGE='system-images;android-35;google_apis;x86_64'
          sudo chown "$(id -u)" /dev/kvm
          "$SDKMANAGER" "platform-tools" "emulator" "$IMAGE"
          export PATH="$SDK/platform-tools:$PATH"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/rahyab-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          printf 'no\n' | "$(dirname "$SDKMANAGER")/avdmanager" create avd -n rahyab-test -k "$IMAGE" -p "$ANDROID_AVD_HOME/rahyab-test.avd" --force
          "$SDK/emulator/emulator" -list-avds | grep -Fx rahyab-test
          "$SDK/emulator/emulator" -avd rahyab-test -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > emulator.log 2>&1 &
          export ANDROID_SERIAL=emulator-5554
          timeout 240 adb wait-for-device || { cat emulator.log; exit 1; }
          timeout 240 bash -c 'until [[ "$(adb shell getprop sys.boot_completed | tr -d "\r")" == 1 ]]; do sleep 3; done'
          adb shell input keyevent 82
          adb shell getprop ro.product.cpu.abilist | tee device-test-result.txt
          grep -qw x86_64 device-test-result.txt
          python3 scripts/check-smart-connect.py --authorize-emulator app/build/outputs/apk/debug/app-debug.apk | tee -a device-test-result.txt
      - name: Upload emulator test result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RahYab-emulator-test-result
          path: |
            device-test-result.txt
            emulator.log
          if-no-files-found: ignore
