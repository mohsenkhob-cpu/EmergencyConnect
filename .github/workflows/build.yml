name: Build RahYab Next APK

on:
  workflow_dispatch:
  push:
    branches:
      - rahyab-next

permissions:
  contents: write
  actions: read

concurrency:
  group: rahyab-next-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate Android SDK tools
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under $SDK_ROOT"
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
      - name: Install Android SDK packages
        run: |
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools"
          "$SDKMANAGER" "platforms;android-35"
          "$SDKMANAGER" "build-tools;35.0.0"
          "$SDKMANAGER" "ndk;27.2.12479018"
      - name: Locate latest successful OpenVPN 3 native artifact
        id: native-artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/openvpn-native-ci.yml/runs?status=success&per_page=20" --jq '[.workflow_runs[] | select(.conclusion == "success")] | sort_by(.created_at) | last | .id')"
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "No successful OpenVPN 3 native build is available."
            exit 1
          fi
          ARTIFACT_COUNT="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" --jq '[.artifacts[] | select(.name == "RahYab-OpenVPN3-native-arm64-compile-check" and .expired == false)] | length')"
          if [ "$ARTIFACT_COUNT" -lt 1 ]; then
            echo "The latest successful native workflow has no usable ARM64 artifact."
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Using successful native build run $RUN_ID"

      - name: Download verified OpenVPN 3 ARM64 native library
        uses: actions/download-artifact@v4
        with:
          name: RahYab-OpenVPN3-native-arm64-compile-check
          repository: mohsenkhob-cpu/EmergencyConnect
          run-id: ${{ steps.native-artifact.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: app/src/main/jniLibs/arm64-v8a
      - name: Verify packaged OpenVPN 3 JNI ABI
        run: |
          LIB="app/src/main/jniLibs/arm64-v8a/libopenvpn3_jni.so"
          test -s "$LIB"
          file "$LIB" | grep -q "ARM aarch64"
          readelf -Ws "$LIB" | grep -q "Java_ir_emergencyconnect_engine_OpenVpn3Bridge_nativeStartSession"
          readelf -Ws "$LIB" | grep -q "Java_ir_emergencyconnect_engine_OpenVpn3Bridge_nativeBindTunService"
      - name: Strip native debug sections to reduce APK size
        run: |
          NDK_ROOT="$ANDROID_HOME/ndk/27.2.12479018"
          STRIP="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          test -x "$STRIP"
          find app/src/main/jniLibs -type f -name '*.so' -print0 | while IFS= read -r -d '' LIB; do
            BEFORE="$(stat -c%s "$LIB")"
            "$STRIP" --strip-debug "$LIB"
            AFTER="$(stat -c%s "$LIB")"
            echo "$(basename "$LIB"): $BEFORE -> $AFTER bytes"
          done
          readelf -Ws app/src/main/jniLibs/arm64-v8a/libopenvpn3_jni.so | grep -q "Java_ir_emergencyconnect_engine_OpenVpn3Bridge_nativeStartSession"
          readelf -Ws app/src/main/jniLibs/arm64-v8a/libopenvpn3_jni.so | grep -q "Java_ir_emergencyconnect_engine_OpenVpn3Bridge_nativeBindTunService"
      - name: Prepare persistent debug signing cache
        run: mkdir -p "$HOME/.android"
      - name: Reuse debug signing key across CI builds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: rahyab-debug-keystore-v2
      - name: Ensure persistent debug signing key exists
        run: |
          KEYSTORE="$HOME/.android/debug.keystore"
          if [ ! -s "$KEYSTORE" ]; then
            keytool -genkeypair -v \
              -keystore "$KEYSTORE" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          test -s "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass android -alias androiddebugkey
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify experimental OpenVPN JNI and TUN safety contracts
        run: bash overlay/native/android-jni/check_session_gate.sh
      - name: Build debug APK
        run: gradle --no-daemon -PciVersionCode="$GITHUB_RUN_NUMBER" testDebugUnitTest assembleDebug
      - name: Verify APK signature, package, ABI, alignment and checksum
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          test -s "$APK"
          unzip -tq "$APK"
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$TOOLS/zipalign" -c -v 4 "$APK"
          "$TOOLS/aapt" dump badging "$APK" | grep -F "package: name='com.rahyab.next'"
          "$TOOLS/aapt" dump badging "$APK" | grep -F "native-code: 'arm64-v8a'"
          {
            echo "APK bytes: $(stat -c%s "$APK")"
            sha256sum "$APK"
            "$TOOLS/apksigner" verify --print-certs "$APK" | grep -E "Signer #1 certificate SHA-256 digest:"
          } | tee "app/build/outputs/apk/debug/APK-INTEGRITY.txt"
      - name: Upload verified APK and integrity report
        uses: actions/upload-artifact@v4
        with:
          name: RahYab-Next-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/APK-INTEGRITY.txt
          if-no-files-found: error
      - name: Publish public download release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rahyab-build-${{ github.run_number }}
          name: RahYab build #${{ github.run_number }}
          prerelease: true
          generate_release_notes: false
          body: |
            RahYab VPN debug build generated by the verified Android build workflow.
            Package: com.rahyab.next
            Architecture: arm64-v8a
            This build has passed CI package/signature/ABI checks; device installation and VPN connectivity still require device testing.
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/APK-INTEGRITY.txt
          fail_on_unmatched_files: true
