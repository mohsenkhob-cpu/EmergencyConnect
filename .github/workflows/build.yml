name: Build RahYabVPN APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - v2-engine-starter

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project ZIP
        run: |
          ZIP_FILE="./RahYabVPN-v2-Engine-Starter-Root-1.zip"
          test -f "$ZIP_FILE" || { echo "V2 ZIP file not found"; exit 1; }
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

      - name: Apply maintained overlay
        run: |
          PROJECT_DIR=$(dirname "$(find extracted -name settings.gradle -type f | head -n 1)")
          test -f "$PROJECT_DIR/settings.gradle" || { echo "Gradle project not found"; exit 1; }
          if [ -d overlay ]; then
            cp -a overlay/. "$PROJECT_DIR/"
          fi
          echo "Project overlay applied to $PROJECT_DIR"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$(find extracted -name settings.gradle -type f | head -n 1)")
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RahYabVPN-v2-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
