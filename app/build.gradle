plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def ciVersionCode = project.findProperty('ciVersionCode')

android {
    namespace 'com.rahyab.next'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mohsen.filter'
        minSdk 26
        targetSdk 35
        versionCode (ciVersionCode != null ? ciVersionCode.toString().toInteger() : 14)
        versionName '1.0.13'
        // Current target phone is ARM64; avoid packaging unused emulator/32-bit ABIs.
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
}

dependencies {
    implementation files('libs/libXray.aar')
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    // Official embeddable WireGuard tunnel implementation (Maven Central).
    implementation 'com.wireguard.android:tunnel:1.0.20260102'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    // sing-box Android binding; the AAR is fetched by the JitPack build script.
    implementation 'com.github.singbox-android:libbox:1.14.0'

    // Local JVM tests for provider parsing and ranking rules.
    testImplementation 'junit:junit:4.13.2'
}
