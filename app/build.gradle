plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rahyab.next'
    compileSdk 35

    defaultConfig {
        applicationId 'com.rahyab.next'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
        // Current target phone is ARM64; avoid packaging unused emulator/32-bit ABIs.
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
}

dependencies {
    // Official embeddable WireGuard tunnel implementation (Maven Central).
    implementation 'com.wireguard.android:tunnel:1.0.20260102'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    // sing-box Android binding; the AAR is fetched by the JitPack build script.
    implementation 'com.github.singbox-android:libbox:1.14.3'
}
