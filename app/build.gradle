plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def ciVersionCode = project.findProperty('ciVersionCode')

android {
    namespace 'com.rahyab.next'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mohsen.filter'
        minSdk 26
        targetSdk 35
        versionCode (ciVersionCode != null ? ciVersionCode.toString().toInteger() : 36)
        versionName '1.0.35'
        // Current target phone is ARM64; avoid packaging unused emulator/32-bit ABIs.
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    packaging {
        jniLibs {
            // Native executable engines must be physically extracted into
            // nativeLibraryDir; ProcessBuilder cannot exec from inside APK.
            useLegacyPackaging true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
}

dependencies {
    implementation files('libs/libXray.aar')
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    // Official embeddable WireGuard tunnel implementation (Maven Central).
    implementation 'com.wireguard.android:tunnel:1.0.20260102'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    // Local JVM tests for provider parsing and ranking rules.
    testImplementation 'junit:junit:4.13.2'
    // Android's JVM test stub throws on JSONObject; use a real JSON implementation in unit tests.
    testImplementation 'org.json:json:20240303'
}
